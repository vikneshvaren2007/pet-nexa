<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PET NEXA - Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="admin-login">
    <div class="login-card">
        <div class="paw-logo">🐾</div>
        <h1>PET NEXA</h1>
        <p>Sign in to your administration dashboard</p>

        {% if error %}
        <div class="error-message">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <input type="text" name="username" placeholder="Admin Username" required autocomplete="username" autofocus>
            <input type="password" name="password" placeholder="Admin Password" required autocomplete="current-password">
            <button type="submit">
                <i class="fa-solid fa-lock"></i> SIGN IN
            </button>
        </form>

        <div style="margin-top:25px; font-size:12px; color:var(--text-muted);">
            PET NEXA Management System &copy; 2026
        </div>
    </div>
</div>

</body>
</html>
